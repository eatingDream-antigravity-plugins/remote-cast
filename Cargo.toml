[package]
name = "chrome-stream-mcp"
version = "0.7.4"
edition = "2021"
license = "MIT"
description = "Low-bandwidth native Rust Chrome DevTools screencast relay, interactive browser controller, and MCP App server."
repository = "https://github.com/eatingDream-antigravity-plugins/remote-cast"
keywords = ["chrome", "cdp", "screencast", "mcp", "browser"]
categories = ["command-line-utilities", "network-programming", "web-programming"]

[[bin]]
name = "chrome-stream-mcp"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
